services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keypassage
      POSTGRES_PASSWORD: keypassage
      POSTGRES_DB: keypassage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keypassage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keypassage -d keypassage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keypassage_pg:
